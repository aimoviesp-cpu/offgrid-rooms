var PROTOCOL_TOTAL_WEEKS=PROTOCOL_WEEKS.length;

var calcProtoTargets=function(startDate,today){
  if(!startDate) return null;
  var dayIdx=protoDayIndex(startDate,today);
  if(dayIdx<0) return null;

  var totalDays=Math.min(dayIdx+1,PROTOCOL_TOTAL_DAYS);
  var result={eatCum:0,burnCum:0,defCum:0,stepsCum:0,workoutsCum:0,refeedsCum:0};

  for(var d=0;d<totalDays;d++){
    var wkNum=Math.floor(d/7)+1;
    if(wkNum>PROTOCOL_TOTAL_WEEKS)wkNum=PROTOCOL_TOTAL_WEEKS;
    var wkData=PROTOCOL_WEEKS[wkNum-1];
    // Use per-week daily averages (handles partial final week correctly)
    var daysInThisWeek=(wkNum===PROTOCOL_TOTAL_WEEKS&&wkNum===9)?3:7;
    result.eatCum+=wkData.eatWk/daysInThisWeek;
    result.burnCum+=wkData.burnWk/daysInThisWeek;
    result.defCum+=wkData.defWk/daysInThisWeek;
    result.stepsCum+=wkData.stepsDay;
    result.workoutsCum+=wkData.workouts/daysInThisWeek;
    result.refeedsCum+=wkData.refeeds/daysInThisWeek;
  }

  return {
    eatCum:    Math.round(result.eatCum),
    burnCum:   Math.round(result.burnCum),
    defCum:    Math.round(result.defCum),
    stepsCum:  Math.round(result.stepsCum),
    workoutsCum: Math.round(result.workoutsCum),
    refeedsCum:  Math.round(result.refeedsCum),
    totalDays:   totalDays,
    currentWeek: Math.min(PROTOCOL_TOTAL_WEEKS, Math.floor(dayIdx/7)+1),
    dayOfWeek:   (dayIdx%7)+1,
  };
};

var calcProtoActuals=function(days,startDate,today){
  if(!startDate) return null;
  var dayIdx=protoDayIndex(startDate,today);
  if(dayIdx<0) return null;

  var maxDay=Math.min(dayIdx,PROTOCOL_TOTAL_DAYS-1);
  var eatCum=0,burnCum=0,stepsCum=0,workoutsCum=0,refeedsCum=0,loggedDays=0;

  for(var d=0;d<=maxDay;d++){
    var dt=addDays(startDate,d);
    var dd=days[dt];
    if(dd){
      if(dd.calIn||dd.calBurn) loggedDays++;
      eatCum+=(dd.calIn||0);
      burnCum+=(dd.calBurn||0);
      if(dd.workoutType&&dd.workoutType!=="Rest") workoutsCum++;
      stepsCum+=(dd.stepsNum||0);
    }
  }

  return {
    eatCum:eatCum,
    burnCum:burnCum,
    defCum: burnCum-eatCum,
    stepsCum:stepsCum,
    workoutsCum:workoutsCum,
    refeedsCum: 0,
    loggedDays:loggedDays,
  };
};

function buildAIContext(days){
  var today=toDay();
  var L7=Array.from({length:7},function(_,i){var d=new Date();d.setDate(d.getDate()-(6-i));return fmtDate(d);});
  var L30=Array.from({length:30},function(_,i){var d=new Date();d.setDate(d.getDate()-(29-i));return fmtDate(d);});
  var todayData=days[today]||{};
  var todayPct=dayPct(todayData);
  var domainScores={};
  DOMAINS.forEach(function(d){domainScores[d.label]=domainPct(todayData,d)+"%";});
  var str=0;var d2=new Date();
  while(true){var k=fmtDate(d2);if(dayPct(days[k])>0){str++;d2.setDate(d2.getDate()-1);}else break;}
  var avgs7={};
  DOMAINS.forEach(function(d){
    var avg=Math.round(L7.reduce(function(a,dt){return a+domainPct(days[dt],d);},0)/7);
    avgs7[d.label]=avg+"%";
  });
  var calIn=todayData.calIn||0;
  var calBurn=todayData.calBurn||0;
  var deficit=calBurn-calIn;
  var workout=todayData.workoutType||"Not logged";
  var workoutNotes=todayData.workoutNotes||"";
  var weekAvg=Math.round(L7.reduce(function(a,dt){return a+dayPct(days[dt]||{});},0)/7);
  var allDates=Object.keys(days).sort();
  var loggedDays=allDates.filter(function(dt){var d=days[dt];return d&&(d.calIn||d.calBurn||d.weight||d.workoutType||d.stepsNum);});
  var calDays=loggedDays.filter(function(dt){return days[dt].calIn||days[dt].calBurn;});
  var totalCalIn=calDays.reduce(function(a,dt){return a+(days[dt].calIn||0);},0);
  var totalCalBurn=calDays.reduce(function(a,dt){return a+(days[dt].calBurn||0);},0);
  var totalDeficit=totalCalBurn-totalCalIn;
  var avgCalIn=calDays.length?Math.round(totalCalIn/calDays.length):0;
  var avgCalBurn=calDays.length?Math.round(totalCalBurn/calDays.length):0;
  var avgDeficit=calDays.length?Math.round(totalDeficit/calDays.length):0;
  var deficitDays=calDays.filter(function(dt){return(days[dt].calBurn||0)>(days[dt].calIn||0);}).length;
  var surplusDays=calDays.length-deficitDays;
  var stepDays=loggedDays.filter(function(dt){return days[dt].stepsNum;});
  var totalSteps=stepDays.reduce(function(a,dt){return a+(days[dt].stepsNum||0);},0);
  var avgSteps=stepDays.length?Math.round(totalSteps/stepDays.length):0;
  var workoutCounts={};WTYPES.forEach(function(t){workoutCounts[t]=0;});
  loggedDays.forEach(function(dt){var wt=days[dt].workoutType;if(wt&&workoutCounts[wt]!==undefined)workoutCounts[wt]++;});
  var totalSessions=loggedDays.filter(function(dt){return days[dt].workoutType&&days[dt].workoutType!=="Rest";}).length;
  var wtDaysAll=loggedDays.filter(function(dt){return days[dt].weight;});
  var firstWeight=wtDaysAll.length?days[wtDaysAll[0]].weight:null;
  var latestWeight=wtDaysAll.length?days[wtDaysAll[wtDaysAll.length-1]].weight:null;
  var wtChangeAll=wtDaysAll.length>=2?(days[wtDaysAll[wtDaysAll.length-1]].weight-days[wtDaysAll[0]].weight).toFixed(1):null;
  var wtChange30=null;
  var wt30=L30.filter(function(dt){return days[dt]&&days[dt].weight;});
  if(wt30.length>=2)wtChange30=(days[wt30[wt30.length-1]].weight-days[wt30[0]].weight).toFixed(1);
  // ENV LOG STATS (last 30 days)
  var envAlc=L30.filter(function(dt){return days[dt]&&days[dt].env&&days[dt].env.alcohol;}).length;
  var envWeed=L30.filter(function(dt){return days[dt]&&days[dt].env&&days[dt].env.weed;}).length;
  var envClean=L30.filter(function(dt){var d=days[dt];return d&&(d.calIn||d.calBurn||d.weight||d.workoutType)&&envCount(d)===0;}).length;
  var last30Log=L30.map(function(dt){var d=days[dt]||{};var ci=d.calIn||0;var cb=d.calBurn||0;var def=cb-ci;var parts=[];if(ci||cb){parts.push("in="+ci+" burn="+cb+" "+(def>=0?"deficit=+"+def:"surplus="+Math.abs(def)));}if(d.stepsNum){parts.push("steps="+d.stepsNum);}if(d.workoutType){parts.push("workout="+d.workoutType);}if(d.weight){parts.push("weight="+d.weight+"lbs");}if(d.env){var et=[];if(d.env.alcohol)et.push("alcohol");if(d.env.weed)et.push("weed");if(et.length)parts.push("triggers="+et.join("+"));}return dt.slice(5)+": "+(parts.length?parts.join(" "):"no data");}).join("\n");
  var weekBlocks=[];for(var wi=0;wi<L30.length;wi+=7){var wk=L30.slice(wi,wi+7);var wkDef=wk.reduce(function(a,dt){var d=days[dt]||{};return a+((d.calBurn||0)-(d.calIn||0));},0);var wkTrig=wk.reduce(function(a,dt){return a+envCount(days[dt]);},0);weekBlocks.push({range:wk[0].slice(5)+" to "+wk[wk.length-1].slice(5),deficit:wkDef,triggers:wkTrig});}
  weekBlocks.sort(function(a,b){return b.deficit-a.deficit;});
  var protocolSummary=PROTOCOLS.map(function(p){var items=[];if(p.items)items=p.items;else if(p.sections){p.sections.forEach(function(s){if(s.items)items=items.concat(s.items);if(s.layers)s.layers.forEach(function(l){items=items.concat(l.items);});});}return p.label+": "+items.slice(0,4).join("; ");}).join("\n");
  return "=== OPERAXIS SYSTEM CONTEXT ===\n"+"Date: "+today+"\n"+"Streak: "+str+" days\n"+"Today's overall score: "+todayPct+"%\n"+"7-day average score: "+weekAvg+"%\n\n"+"TODAY'S DOMAIN SCORES:\n"+Object.entries(domainScores).map(function(e){return"  "+e[0]+": "+e[1];}).join("\n")+"\n\n"+"7-DAY DOMAIN AVERAGES:\n"+Object.entries(avgs7).map(function(e){return"  "+e[0]+": "+e[1];}).join("\n")+"\n\n"+"TODAY'S NUTRITION & TRAINING:\n"+"  Calories eaten: "+(calIn||"not logged")+"\n"+"  Calories burned: "+(calBurn||"not logged")+"\n"+"  Deficit/Surplus: "+(calBurn?(deficit>=0?"deficit +"+deficit+" kcal":"surplus "+Math.abs(deficit)+" kcal"):"not logged")+"\n"+"  Workout: "+workout+(workoutNotes?" — "+workoutNotes:"")+"\n\n"+"=== ENVIRONMENT TRIGGERS (last 30 days) ===\n"+"  Alcohol days: "+envAlc+"\n"+"  Weed days: "+envWeed+"\n"+"  Clean training days: "+envClean+"\n\n"+"=== ALL-TIME STATS ("+loggedDays.length+" logged days total) ===\n\n"+"CALORIES ALL-TIME ("+calDays.length+" days logged):\n"+"  Avg calories in per day: "+avgCalIn+" kcal\n"+"  Avg calories burned per day: "+avgCalBurn+" kcal\n"+"  Avg daily deficit: "+(avgDeficit>=0?"+"+avgDeficit:String(avgDeficit))+" kcal\n"+"  Total accumulated deficit: "+(totalDeficit>=0?"+"+totalDeficit:String(totalDeficit))+" kcal\n"+"  Days in deficit: "+deficitDays+" / "+calDays.length+"\n"+"  Days in surplus: "+surplusDays+" / "+calDays.length+"\n\n"+"STEPS ALL-TIME ("+stepDays.length+" days logged):\n"+"  Total steps logged: "+totalSteps.toLocaleString()+"\n"+"  Average steps per day: "+avgSteps.toLocaleString()+"\n\n"+"WORKOUTS ALL-TIME ("+totalSessions+" training sessions):\n"+WTYPES.map(function(t){return"  "+t+": "+workoutCounts[t]+" sessions";}).join("\n")+"\n\n"+"WEIGHT TREND:\n"+"  Starting weight: "+(firstWeight?firstWeight+" lbs":"not logged")+"\n"+"  Latest weight: "+(latestWeight?latestWeight+" lbs":"not logged")+"\n"+"  All-time change: "+(wtChangeAll!==null?wtChangeAll+" lbs":"insufficient data")+"\n"+"  30-day change: "+(wtChange30!==null?wtChange30+" lbs":"insufficient data")+"\n\n"+"BEST DEFICIT WEEKS (last 30 days, with trigger count):\n"+weekBlocks.slice(0,2).map(function(w){return"  "+w.range+": "+(w.deficit>=0?"+":"")+w.deficit+" kcal (triggers: "+w.triggers+")";}).join("\n")+"\n"+"WORST SURPLUS WEEKS (last 30 days, with trigger count):\n"+weekBlocks.slice(-2).reverse().map(function(w){return"  "+w.range+": "+(w.deficit>=0?"+":"")+w.deficit+" kcal (triggers: "+w.triggers+")";}).join("\n")+"\n\n"+"LAST 30 DAYS DETAIL LOG:\n"+last30Log+"\n\n"+"SYSTEM PROTOCOLS (summary):\n"+protocolSummary;
}

function CalendarPicker(props){

function ProtocolDetail(props){
  var id=props.id,onBack=props.onBack;
  var S={bg:"#000",card:"#0a0a0a",border:"#1a1a1a",text:"#e8e8e8",muted:"#555",accent:"#4a9eff",dim:"#111"};
  var dp=PROTOCOLS.find(function(d){return d.id===id;});
  if(!dp)return null;
  var hdr=function(title){return <div style={{fontSize:11,fontWeight:600,color:"#777",textTransform:"uppercase",letterSpacing:1,marginBottom:8,marginTop:4}}>{title}</div>;};
  var renderSec=function(sec,i){
    if(sec.type==="layers")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}{sec.layers.map(function(l,li){return(<div key={li} style={{marginBottom:10,padding:"10px 12px",background:S.dim,borderRadius:8,borderLeft:"3px solid "+dp.border}}><div style={{fontSize:13,fontWeight:600,color:S.text,marginBottom:5}}>{l.label}</div>{l.items.map(function(item,ii){return <div key={ii} style={{fontSize:12,color:S.text,paddingLeft:8,marginBottom:3}}>{"• "+item}</div>;})}</div>);})}</div>);
    if(sec.type==="priorities")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}<div style={{padding:"10px 12px",background:S.dim,borderRadius:8}}>{sec.items.map(function(item,ii){return <div key={ii} style={{fontSize:13,color:ii===0?S.text:S.accent,fontWeight:ii>0?600:400,marginBottom:6}}>{item}</div>;})}</div></div>);
    if(sec.type==="mission")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}<div style={{padding:"12px 14px",background:S.dim,borderRadius:8,borderLeft:"3px solid "+dp.border}}><div style={{fontSize:13,color:S.text,lineHeight:1.7,fontStyle:"italic"}}>"{sec.quote}"</div></div></div>);
    if(sec.type==="client")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}{[["The Client",sec.client],["The Problem",sec.problem],["The Result",sec.result]].map(function(pair,ci){return(<div key={ci} style={{marginBottom:8,padding:"10px 12px",background:S.dim,borderRadius:8}}><div style={{fontSize:11,color:"#777",marginBottom:4}}>{pair[0]}</div><div style={{fontSize:13,color:S.text,lineHeight:1.6}}>{pair[1]}</div></div>);})}</div>);
    if(sec.type==="proof")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><tbody>{sec.rows.map(function(r,ri){return(<tr key={ri} style={{borderBottom:"1px solid "+S.dim}}><td style={{padding:"7px 10px",color:"#777",width:"25%"}}>{r[0]}</td><td style={{padding:"7px 10px",color:S.text}}>{r[1]}</td></tr>);})}</tbody></table></div>);
    if(sec.type==="phase")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}<div style={{fontSize:12,color:S.muted,marginBottom:8,fontStyle:"italic"}}>{sec.note}</div><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{borderBottom:"1px solid "+S.border}}>{["Metric","Current","Target"].map(function(h){return <th key={h} style={{padding:"6px 8px",textAlign:"left",color:"#777",fontWeight:500}}>{h}</th>;})}</tr></thead><tbody>{sec.rows.map(function(r,ri){return <tr key={ri} style={{borderBottom:"1px solid "+S.dim}}>{r.map(function(cell,ci){return <td key={ci} style={{padding:"7px 8px",color:ci===0?S.text:S.muted,fontSize:12}}>{cell}</td>;})}</tr>;})}</tbody></table></div>);
    if(sec.type==="milestones"||sec.type==="roadmap")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><tbody>{sec.rows.map(function(r,ri){return <tr key={ri} style={{borderBottom:"1px solid "+S.dim}}>{r.map(function(cell,ci){return <td key={ci} style={{padding:"7px 8px",color:ci===0?S.text:S.muted,fontSize:12}}>{cell}</td>;})}</tr>;})}</tbody></table></div>);
    if(sec.type==="nonneg")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}{sec.items.map(function(item,ii){return(<div key={ii} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid "+S.dim}}><div style={{width:16,height:16,border:"1.5px solid "+dp.border,borderRadius:3,flexShrink:0}}/><span style={{fontSize:13,color:S.text}}>{item}</span></div>);})}</div>);
    if(sec.type==="thisweek")return(<div key={i} style={{marginBottom:16}}>{hdr(sec.title)}{sec.items.map(function(item,ii){return(<div key={ii} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"7px 0",borderBottom:"1px solid "+S.dim}}><div style={{width:16,height:16,border:"1.5px solid "+S.accent,borderRadius:3,flexShrink:0,marginTop:1}}/><span style={{fontSize:13,color:S.text,lineHeight:1.5}}>{item}</span></div>);})}</div>);
    return null;
  };
  return(
    <div>
      <button onClick={onBack} style={{background:"transparent",border:"1px solid #1a1a1a",borderRadius:6,padding:"6px 12px",color:"#555",fontSize:12,cursor:"pointer",marginBottom:14}}>{"‹ Back"}</button>
      <div style={{background:"#0a0a0a",border:"1px solid "+dp.border,borderRadius:10,overflow:"hidden"}}>
        <div style={{background:dp.color,padding:"14px 16px",borderBottom:"1px solid "+dp.border}}><div style={{fontSize:16,fontWeight:600}}>{dp.label}</div></div>
        <div style={{padding:"14px 16px"}}>{dp.sections?dp.sections.map(function(sec,i){return renderSec(sec,i);}):dp.items.map(function(item,i){return(<div key={i} style={{fontSize:13,color:"#e8e8e8",lineHeight:1.8,paddingBottom:i<dp.items.length-1?12:0,marginBottom:i<dp.items.length-1?12:0,borderBottom:i<dp.items.length-1?"1px solid #111":"none"}}>{item}</div>);})}</div>
      </div>
    </div>
  );
}

function ModedDomainCard(props){
  var domain=props.domain,dayData=props.dayData,onCheckToggle=props.onCheckToggle,onModeChange=props.onModeChange,S=props.S;
  var domainChecks=(dayData.checks&&dayData.checks[domain.id])||{};
  var currentMode=dayData.modes&&dayData.modes[domain.id]||"standard";
  var modeList=domain.id==="fitness"?FITNESS_MODES:FINANCIAL_MODES;
  var pct=dPctModed(domainChecks,domain);
  var isOpen=props.isOpen;
  var mc=modeColor(currentMode);
  var habits=domain.modes[currentMode]||[];
  var totalW=habits.reduce(function(a,h){return a+h.w;},0);
  var cycleMode=function(e){e.stopPropagation();var idx=modeList.indexOf(currentMode);var next=modeList[(idx+1)%modeList.length];onModeChange(domain.id,next);};
  return(
    <div style={Object.assign({},props.cardStyle,{marginBottom:10,overflow:"hidden"})}>
      <div onClick={props.onHeaderToggle} style={{display:"flex",alignItems:"center",padding:"12px 14px",cursor:"pointer",gap:8}}>
        <span style={{flex:1,fontWeight:500,fontSize:15}}>{domain.label}</span>
        <div onClick={cycleMode} style={{padding:"3px 10px",borderRadius:20,border:"1px solid "+mc.border,background:mc.bg,color:mc.text,fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0}}>{modeLabel(currentMode)}</div>
        <span style={{fontSize:13,fontWeight:600,color:pc(pct),marginLeft:4}}>{pct}%</span>
        <span style={{color:S.muted,fontSize:11,marginLeft:4}}>{isOpen?"▲":"▼"}</span>
      </div>
      <div style={{height:2,background:S.border}}><div style={{height:"100%",width:pct+"%",background:pc(pct),transition:"width 0.3s"}}/></div>
      {isOpen&&(
        <div style={{borderTop:"1px solid "+S.border,padding:"8px 14px"}}>
          {habits.map(function(h,i){
            var modeChecks=domainChecks[currentMode]||[];
            var checked=modeChecks[i]||false;
            var fixedPts=modeHabitPts(domain.id,currentMode,habits.length);
            var hp=fixedPts!==null?fixedPts:(totalW>0?Math.round((h.w/totalW)*100):0);
            return(
              <div key={currentMode+"-"+i} onClick={function(){onCheckToggle(domain.id,currentMode,i);}} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",cursor:"pointer",borderBottom:i<habits.length-1?"1px solid "+S.dim:"none"}}>
                <div style={{width:18,height:18,border:"1.5px solid "+(checked?S.accent:S.muted),borderRadius:4,background:checked?S.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {checked&&<span style={{color:"#000",fontSize:11,fontWeight:700}}>{"✓"}</span>}
                </div>
                <span style={{flex:1,fontSize:14,color:checked?S.muted:S.text,textDecoration:checked?"line-through":"none"}}>{h.label}</span>
                <span style={{fontSize:11,color:checked?S.accent:S.muted,minWidth:32,textAlign:"right"}}>{hp}%</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function GapBar(props){
  var actual=props.actual,target=props.target,label=props.label,unit=props.unit,higherIsBetter=props.higherIsBetter;
  if(higherIsBetter===undefined)higherIsBetter=true;
  var pct=target>0?Math.min(100,Math.round((actual/target)*100)):0;
  var gap=actual-target;
  var onTrack=higherIsBetter?(actual>=target):(actual<=target);
  var barColor=pct>=90?"#34d399":pct>=60?"#60a5fa":pct>=30?"#f59e0b":"#f87171";
  var gapColor=onTrack?"#34d399":"#f87171";
  var fmtNum=function(n){return Math.abs(n)>=1000?Math.round(n/100)/10+"k":Math.round(n).toString();};
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
        <span style={{fontSize:12,color:"#888",fontWeight:500}}>{label}</span>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:11,color:"#555"}}>{fmtNum(actual)}{unit} / {fmtNum(target)}{unit}</span>
          <span style={{fontSize:12,fontWeight:700,color:gapColor,minWidth:60,textAlign:"right"}}>
            {onTrack?"✓ +":(gap>=0?"+":"")+fmtNum(gap)+unit}
          </span>
        </div>
      </div>
      <div style={{height:5,background:"#1a1a1a",borderRadius:3,overflow:"hidden"}}>
        <div style={{height:"100%",width:pct+"%",background:barColor,borderRadius:3,transition:"width 0.4s ease"}}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
        <span style={{fontSize:10,color:"#444"}}>{pct}% of target</span>
        <span style={{fontSize:10,color:gapColor}}>{onTrack?"On track":fmtNum(Math.abs(gap))+unit+" behind"}</span>
      </div>
    </div>
  );
}

function ProtocolTab(props){
  var days=props.days,protoStart=props.protoStart,onSetStart=props.onSetStart;
  var S={bg:"#000",card:"#0a0a0a",border:"#1a1a1a",text:"#e8e8e8",muted:"#555",accent:"#4a9eff",dim:"#111"};
  var vs=useState("protocol");var view=vs[0],setView=vs[1];
  var today=toDay();

  if(!protoStart){
    return(
      <div style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>Protocol Start Date</div>
        <div style={{fontSize:13,color:S.muted,marginBottom:24,lineHeight:1.6}}>Set your 8-week cutting protocol start date to begin tracking your compliance vs targets.</div>
        <button onClick={onSetStart} style={{background:S.accent,color:"#000",border:"none",borderRadius:10,padding:"12px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Set Start Date</button>
      </div>
    );
  }

  var targets=calcProtoTargets(protoStart,today);
  var actuals=calcProtoActuals(days,protoStart,today);

  if(!targets){
    return(
      <div style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:14,color:S.muted}}>Protocol hasn't started yet.</div>
        <div style={{fontSize:12,color:"#333",marginTop:8}}>Start date: {protoStart}</div>
      </div>
    );
  }

  var currentWeek=targets.currentWeek;
  var currentWeekData=PROTOCOL_WEEKS[Math.min(currentWeek-1,PROTOCOL_TOTAL_WEEKS-1)];
  var phaseCol=PHASE_COL[currentWeekData.phase]||{bg:"#1a1a1a",border:"#333",text:"#888"};

  var totalProtoDef=PROTOCOL_WEEKS.reduce(function(a,w){return a+w.defWk;},0);
  var totalProtoEat=PROTOCOL_WEEKS.reduce(function(a,w){return a+w.eatWk;},0);
  var totalProtoSteps=PROTOCOL_WEEKS.reduce(function(a,w){
    // Final partial week only has 3 days
    var d=(w.wk===PROTOCOL_TOTAL_WEEKS&&w.wk===9)?3:7;
    return a+w.stepsDay*d;
  },0);
  var totalProtoWorkouts=PROTOCOL_WEEKS.reduce(function(a,w){return a+w.workouts;},0);

  var daysTotal=PROTOCOL_TOTAL_DAYS;
  var daysElapsed=targets.totalDays;
  var daysRemaining=daysTotal-daysElapsed;
  var pctComplete=Math.round((daysElapsed/daysTotal)*100);

  var currentRate=actuals.defCum>0&&targets.totalDays>0?(actuals.defCum/targets.totalDays):0;
  var projectedTotalDef=Math.round(actuals.defCum+(currentRate*daysRemaining));

  var weekRows=[];
  for(var wk=1;wk<=Math.min(currentWeek,PROTOCOL_TOTAL_WEEKS);wk++){
    var pwk=PROTOCOL_WEEKS[wk-1];
    var daysInWk=(wk===PROTOCOL_TOTAL_WEEKS&&wk===9)?3:7;
    var wkDates=Array.from({length:daysInWk},function(_,i){return addDays(protoStart,(wk-1)*7+i);});
    var wkEat=wkDates.reduce(function(a,dt){return a+((days[dt]&&days[dt].calIn)||0);},0);
    var wkBurn=wkDates.reduce(function(a,dt){return a+((days[dt]&&days[dt].calBurn)||0);},0);
    var wkDef=wkBurn-wkEat;
    var wkSteps=wkDates.reduce(function(a,dt){return a+((days[dt]&&days[dt].stepsNum)||0);},0);
    var wkWorkouts=wkDates.filter(function(dt){return days[dt]&&days[dt].workoutType&&days[dt].workoutType!=="Rest";}).length;
    var isCurrentWk=wk===currentWeek;
    var daysCounted=isCurrentWk?targets.dayOfWeek:daysInWk;
    var pDefTarget=Math.round(pwk.defWk/daysInWk*daysCounted);
    var pEatTarget=Math.round(pwk.eatWk/daysInWk*daysCounted);
    var pStepsTarget=pwk.stepsDay*daysCounted;
    var pWorkoutsTarget=Math.round(pwk.workouts/daysInWk*daysCounted);
    weekRows.push({wk:wk,phase:pwk.phase,defTarget:pDefTarget,defActual:wkDef,eatTarget:pEatTarget,eatActual:wkEat,stepsTarget:pStepsTarget,stepsActual:wkSteps,workoutsTarget:pWorkoutsTarget,workoutsActual:wkWorkouts,isCurrent:isCurrentWk});
  }

  return(
    <div>
      <div style={{background:phaseCol.bg,border:"1px solid "+phaseCol.border,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div>
            <div style={{fontSize:11,color:phaseCol.text,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>{currentWeekData.phase}</div>
            <div style={{fontSize:22,fontWeight:700,color:"#e8e8e8"}}>Week {currentWeek} <span style={{fontSize:13,color:"#666",fontWeight:400}}>/ {PROTOCOL_TOTAL_WEEKS}</span></div>
            <div style={{fontSize:12,color:"#555",marginTop:2}}>Day {targets.dayOfWeek} of week · Day {daysElapsed} total</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:22,fontWeight:700,color:phaseCol.text}}>{pctComplete}%</div>
            <div style={{fontSize:11,color:"#555"}}>complete</div>
            <div style={{fontSize:11,color:"#444",marginTop:2}}>{daysRemaining}d left</div>
          </div>
        </div>
        <div style={{height:4,background:"#0a0a0a",borderRadius:2}}>
          <div style={{height:"100%",width:pctComplete+"%",background:phaseCol.border,borderRadius:2,transition:"width 0.5s ease"}}/>
        </div>
        <div style={{marginTop:10,fontSize:12,color:"#666"}}>
          <span style={{color:"#888"}}>Daily target: </span>
          <span style={{color:phaseCol.text,fontWeight:600}}>{currentWeekData.calDay.toLocaleString()} kcal</span>
          <span style={{color:"#444",marginLeft:12}}>{currentWeekData.macros}</span>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {["protocol","actuals"].map(function(v){return(
          <button key={v} onClick={function(){setView(v);}}
            style={{flex:1,padding:"8px 0",borderRadius:8,border:"1px solid "+(view===v?S.accent:S.border),background:view===v?"#4a9eff22":"transparent",color:view===v?S.accent:S.muted,fontSize:13,fontWeight:view===v?600:400,cursor:"pointer",textTransform:"capitalize"}}>
            {v==="protocol"?"Protocol":"Actuals"}
          </button>
        );})}
      </div>

      {view==="protocol"&&(
        <div>
          <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:12,color:S.muted,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:14}}>Cumulative Targets vs Actuals</div>
            <GapBar label="Deficit" actual={actuals.defCum} target={targets.defCum} unit=" kcal"/>
            <GapBar label="Calories Eaten" actual={actuals.eatCum} target={targets.eatCum} unit=" kcal" higherIsBetter={false}/>
            <GapBar label="Calories Burned" actual={actuals.burnCum} target={targets.burnCum} unit=" kcal"/>
            <GapBar label="Steps" actual={actuals.stepsCum} target={targets.stepsCum} unit=""/>
            <GapBar label="Workouts" actual={actuals.workoutsCum} target={targets.workoutsCum} unit=" sessions"/>
          </div>

          <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontSize:12,color:S.muted,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>{PROTOCOL_TOTAL_WEEKS}-Week Projection</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[
                ["Protocol Target",totalProtoDef.toLocaleString()+" kcal","#4a9eff"],
                ["At Current Rate",projectedTotalDef.toLocaleString()+" kcal",projectedTotalDef>=totalProtoDef?"#34d399":"#f87171"],
                ["Deficit So Far",actuals.defCum.toLocaleString()+" kcal","#e8e8e8"],
                ["Gap",((actuals.defCum-targets.defCum)<0?""+(actuals.defCum-targets.defCum).toLocaleString():"+"+(actuals.defCum-targets.defCum).toLocaleString())+" kcal",(actuals.defCum-targets.defCum)>=0?"#34d399":"#f87171"],
              ].map(function(row){return(
                <div key={row[0]} style={{background:S.dim,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontSize:10,color:"#555",marginBottom:4}}>{row[0]}</div>
                  <div style={{fontSize:15,fontWeight:700,color:row[2]}}>{row[1]}</div>
                </div>
              );})}
            </div>
            {projectedTotalDef<totalProtoDef&&(
              <div style={{marginTop:10,padding:"8px 12px",background:"#3a0a0a",border:"1px solid #f8717144",borderRadius:8,fontSize:12,color:"#fca5a5",lineHeight:1.5}}>
                At your current rate you will finish {(totalProtoDef-projectedTotalDef).toLocaleString()} kcal short of the {PROTOCOL_TOTAL_WEEKS}-week target — roughly {Math.round((totalProtoDef-projectedTotalDef)/3500*10)/10} lbs of fat left on the table.
              </div>
            )}
            {projectedTotalDef>=totalProtoDef&&(
              <div style={{marginTop:10,padding:"8px 12px",background:"#042C53",border:"1px solid #34d39944",borderRadius:8,fontSize:12,color:"#86efac",lineHeight:1.5}}>
                On pace to hit or exceed the {PROTOCOL_TOTAL_WEEKS}-week deficit target. Keep the rate consistent.
              </div>
            )}

        </div>

        <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
          <div style={{fontSize:11,color:S.muted,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Data</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={exportData} style={{background:S.dim,border:"1px solid "+S.border,borderRadius:8,padding:"8px 14px",color:S.text,fontSize:12,cursor:"pointer"}}>Export JSON</button>
            <button onClick={importData} style={{background:S.dim,border:"1px solid "+S.border,borderRadius:8,padding:"8px 14px",color:S.text,fontSize:12,cursor:"pointer"}}>Import JSON</button>
            <button onClick={clearAll} style={{background:"#3a0a0a",border:"1px solid #f8717144",borderRadius:8,padding:"8px 14px",color:"#fca5a5",fontSize:12,cursor:"pointer"}}>Clear all</button>
          </div>
        </div>
      </div>
    );
  };

  var TABS=[
    {id:"daily",label:"Daily"},
    {id:"dashboard",label:"Dashboard"},
    {id:"body",label:"Body"},
    {id:"protocol",label:"Protocol"},
    {id:"protocols",label:"System"},
    {id:"ai",label:"AI"},
    {id:"settings",label:"⚙"}
  ];

  return(
    <div style={{background:S.bg,minHeight:"100vh",color:S.text,paddingBottom:80}}>
      <div style={{maxWidth:560,margin:"0 auto",padding:"16px 14px"}}>
        <div style={{textAlign:"center",marginBottom:14}}>
          <div style={{fontSize:11,letterSpacing:6,textTransform:"uppercase",color:"#3a3a3a",fontWeight:500}}>OperAxis System</div>
        </div>
        {tab==="daily"&&renderDaily()}
        {tab==="dashboard"&&renderDashboard()}
        {tab==="body"&&renderBodyWrapper()}
        {tab==="protocol"&&<ProtocolTab days={days} protoStart={protoStart} onSetStart={function(){setStartCalOpen(true);}}/>}
        {tab==="protocols"&&renderProtocols()}
        {tab==="ai"&&<AICoach days={days}/>}
        {tab==="settings"&&renderSettings()}
      </div>
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0a0a0a",borderTop:"1px solid "+S.border,padding:"6px 4px",display:"flex",justifyContent:"space-around",alignItems:"center",zIndex:50}}>
        {TABS.map(function(t){var active=tab===t.id;return(
          <div key={t.id} onClick={function(){setTab(t.id);if(t.id==="protocols")setProtoDetail(null);}} style={{flex:1,textAlign:"center",padding:"8px 4px",cursor:"pointer",WebkitTapHighlightColor:"transparent"}}>
            <div style={{fontSize:11,fontWeight:active?700:400,color:active?S.accent:S.muted}}>{t.label}</div>
          </div>
        );})}
      </div>
      {startCalOpen&&<CalendarPicker selectedStart={protoStart} onSelect={function(d){setProtoStart(d);svProtoStart(d);}} onReset={function(){setProtoStart("");svProtoStart("");}} onClose={function(){setStartCalOpen(false);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
